alerts:
  - name: HighLatencyP95
    severity: warning
    condition: P95 latency > 3000ms for 5m
    type: symptom-based
    owner: SRE & Alerts Engineer
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: Error rate > 2% for 3m
    type: symptom-based
    owner: SRE & Alerts Engineer
    runbook: docs/alerts.md#alert-2
  - name: CostSpike
    severity: warning
    condition: Average cost per request > 3x baseline for 5m
    type: symptom-based
    owner: SRE & Alerts Engineer
    runbook: docs/alerts.md#alert-3

